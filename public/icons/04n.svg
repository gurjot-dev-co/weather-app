<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- NIGHT LIGHT CLOUD -->
    <linearGradient id="cloudLight" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c5cad3"/>
      <stop offset="50%" stop-color="#a4aab7"/>
      <stop offset="100%" stop-color="#838995"/>
    </linearGradient>
    <!-- NIGHT MEDIUM CLOUD -->
