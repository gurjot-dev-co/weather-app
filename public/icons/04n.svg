    <!-- NIGHT DARK CLOUD -->
    <linearGradient id="cloudDark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#858d9c"/>
      <stop offset="100%" stop-color="#8e9ab1"/>
