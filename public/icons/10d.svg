<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun (rotates around its center) -->
  <g id="sun" transform="rotate(0 70 70)">
    <circle cx="70" cy="70" r="28" fill="#FCD764" />
    <!-- Sun Rays -->
    <g stroke="#F7C44D" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="32" x2="70" y2="18" />
      <line x1="70" y1="108" x2="70" y2="124" />
      <line x1="32" y1="70" x2="18" y2="70" />
      <line x1="108" y1="70" x2="124" y2="70" />
      <line x1="45" y1="45" x2="35" y2="35" />
      <line x1="95" y1="45" x2="105" y2="35" />
      <line x1="45" y1="95" x2="35" y2="105" />
      <line x1="95" y1="95" x2="105" y2="105" />
    </g>
    <!-- Rotation animation -->
    <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="50s" repeatCount="indefinite"/>
  </g>
  <!-- Cloud -->
  <g fill="none" stroke="#B9C7D2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 110 h-60 a20 20 0 0 1 0 -40 a25 25 0 0 1 50 0 a20 20 0 0 1 10 40 z" fill="#B9C7D2" />
  </g>
  <!-- Rain -->
  <style>
    .rain { animation: raindrop 0.9s infinite ease-in; }
    @keyframes raindrop {
      0% { transform: translateY(0); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(25px); opacity: 0; }
    }
  </style>
  <g fill="none" stroke="#008cffff" stroke-width="3" stroke-linecap="round">
    <line class="rain" x1="90"  x2="90"  y1="120" y2="135" style="animation-delay: 0s" />
    <line class="rain" x1="110" x2="110" y1="120" y2="135" style="animation-delay: 0.15s" />
    <line class="rain" x1="130" x2="130" y1="120" y2="135" style="animation-delay: 0.3s" />
    <line class="rain" x1="70" x2="70" y1="120" y2="135" style="animation-delay: 0.3s" />
  </g>
</svg>