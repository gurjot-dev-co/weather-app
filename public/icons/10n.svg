<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Thicker Moon -->
  <g id="moon">
    <path d=" M135 60 A40 40 0 1 1 75 25 A30 30 0 1 0 135 60 "
      fill="url(#moonGrad)" stroke="#86c3db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- rocking rotation -->
      <animateTransform additive="sum" attributeName="transform" dur="10s" repeatCount="indefinite" type="rotate" values="-12 100 60; 12 100 60; -12 100 60"/>
    </path>
  </g>
  <!-- Moon Gradient -->
  <defs>
    <linearGradient id="moonGrad" x1="20" y1="10" x2="120" y2="160">
      <stop offset="0" stop-color="#86c3db" />
      <stop offset="0.5" stop-color="#86c3db" />
      <stop offset="1" stop-color="#5eafcf" />
    </linearGradient>
  </defs>
  <!-- Night Cloud -->
  <g fill="#646d79" stroke="#646d79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 110 h-60 a20 20 0 0 1 0 -40 a25 25 0 0 1 50 0 a20 20 0 0 1 10 40 z" />
  </g>
  <!-- Cloud Gradient -->
  <defs>
    <style>
      .rain {
        animation: raindrop 0.9s infinite ease-in;
      }
      @keyframes raindrop {
        0% { transform: translateY(0); opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(25px); opacity: 0; }
      }
    </style>
  </defs>
  <!-- Raindrops -->
  <g fill="none" stroke="#1d71b5" stroke-width="3" stroke-linecap="round">
    <line class="rain" x1="90"  x2="90"  y1="120" y2="135" style="animation-delay: 0s" />
    <line class="rain" x1="110" x2="110" y1="120" y2="135" style="animation-delay: 0.15s" />
    <line class="rain" x1="130" x2="130" y1="120" y2="135" style="animation-delay: 0.3s" />
    <line class="rain" x1="70" x2="70" y1="120" y2="135" style="animation-delay: 0.3s" />
  </g>
</svg>