    <!-- Rain Animation -->
    <style>
        .rain {
            animation: raindrop 0.9s infinite ease-in;
        }
        @keyframes raindrop {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(70px);
                opacity: 0;
            }
        }
    </style>
